# Orchestrazione dei 4 container del progetto.
# Porte esposte (obbligatorie da specifica):
#   backend  -> 8003
#   frontend -> 8004
#   database -> 3306
#   ollama   -> 11434

version: '3.8'

services:
  # BACKEND (FastAPI + parsers + LLM client + DB connector)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: esonero-backend
    ports:
      - "8003:8003"
    environment:
      - PYTHONPATH=/progetto
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=esonero
      - DB_PASSWORD=esonero_pwd
      - DB_NAME=esonero
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 4G

  # FRONTEND (Jinja2 + HTML/CSS)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: esonero-frontend
    ports:
      - "8004:8004"
    environment:
      - BACKEND_URL=http://backend:8003
    depends_on:
      - backend

  # DATABASE (MariaDB)
  database:
    image: mariadb:11
    container_name: esonero-database
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=root_pwd
      - MARIADB_DATABASE=esonero
      - MARIADB_USER=esonero
      - MARIADB_PASSWORD=esonero_pwd
    volumes:
      - ./mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # OLLAMA (LLM server)
  ollama:
    image: ollama/ollama:latest
    container_name: esonero-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MODEL=llama3.2:3b
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        SERVER_PID=$$!
        echo "[ollama] Attendo che il server sia pronto..."
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        echo "[ollama] Server pronto. Pull del modello $$OLLAMA_MODEL..."
        ollama pull $$OLLAMA_MODEL || echo "[ollama] Pull fallito, riprovo all'uso."
        wait $$SERVER_PID
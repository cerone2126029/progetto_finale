<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LAB Informatica – Sapienza{% endblock %}</title>
    <style>
        :root {
            --sapienza-red: #822433;
            --sapienza-red-dark: #5f1a25;
            --bg: #f4f7f6;
            --card: #ffffff;
            --border: #e0e0e0;
            --text: #333333;
            --muted: #777777;
            --ok: #2e7d32;
            --error: #d8000c;
            --warn: #b26a00;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background: var(--bg); color: var(--text);
            line-height: 1.5;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            background: var(--sapienza-red); color: white;
            padding: 20px 30px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px;
        }
        .header h1 { margin: 0; font-size: 22px; }
        .header .subtitle { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        nav.main-nav {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0 30px;
            display: flex; gap: 5px;
            overflow-x: auto;
        }
        nav.main-nav a {
            padding: 14px 20px;
            color: var(--text); text-decoration: none;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            white-space: nowrap;
        }
        nav.main-nav a:hover { background: #fafafa; }
        nav.main-nav a.active {
            color: var(--sapienza-red);
            border-bottom-color: var(--sapienza-red);
        }
        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .card h2 { margin-top: 0; color: var(--sapienza-red); font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--sapienza-red);
            font-size: 14px;
        }
        input[type="text"], input[type="url"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            font-family: 'Courier New', Courier, monospace;
            resize: vertical;
            background: #fafafa;
            white-space: pre-wrap;
        }
        button, .btn {
            background: var(--sapienza-red);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .btn:hover { background: var(--sapienza-red-dark); }
        button.secondary, .btn.secondary {
            background: #eeeeee; color: var(--text);
            border: 1px solid var(--border);
        }
        button.secondary:hover { background: #e0e0e0; }
        button.danger { background: #c62828; }
        button.danger:hover { background: #8e0000; }
        .grid { display: grid; gap: 20px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
        .stat-box {
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            text-align: center;
        }
        .stat-box .value { font-size: 28px; font-weight: 700; color: var(--sapienza-red); }
        .stat-box .label { font-size: 12px; color: var(--muted); text-transform: uppercase; }
        .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .pill.ok { background: #e7f5e9; color: var(--ok); }
        .pill.error { background: #fde0e0; color: var(--error); }
        .status-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .status-dot.ok { background: var(--ok); }
        .status-dot.error { background: var(--error); }
        .alert {
            padding: 12px 15px;
            border-radius: 4px;
            border-left: 4px solid;
            margin-bottom: 15px;
        }
        .alert.error { background: #fde0e0; color: var(--error); border-color: var(--error); }
        .alert.ok { background: #e7f5e9; color: var(--ok); border-color: var(--ok); }
        .alert.warn { background: #fff3e0; color: var(--warn); border-color: var(--warn); }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        th { background: #fafafa; font-weight: 600; }
        .url-cell {
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .metric-row {
            display: flex; gap: 20px; flex-wrap: wrap;
            background: #fdf3f4;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid var(--sapienza-red);
        }
        .metric-row .metric { font-size: 15px; }
        .metric-row .metric b { color: var(--sapienza-red); }
        .toggle-group { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .toggle-group label {
            margin: 0;
            padding: 8px 14px;
            background: white;
            cursor: pointer;
            color: var(--text);
            font-weight: 500;
        }
        .toggle-group input[type="radio"] { display: none; }
        .toggle-group input[type="radio"]:checked + span {
            background: var(--sapienza-red); color: white;
        }
        .toggle-group span { display: block; padding: 0; }
        details { background: #fafafa; padding: 10px 15px; border-radius: 4px; margin-bottom: 10px; }
        summary { cursor: pointer; font-weight: 600; }
        code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
    </style>
</head>
<body>
    <header class="header">
        <div>
            <h1>Laboratorio di Ingegneria Informatica – Sapienza</h1>
            <div class="subtitle">Andrea Cerone 2126029 · Alessandro Cordischi 2019924 · Andrea Giordano 2148782</div>
        </div>
        <div>
            <a href="/" class="btn secondary" style="background:white; color: var(--sapienza-red);">Home</a>
        </div>
    </header>
    <nav class="main-nav">
        <a href="/" class="{% if active_page == 'home' %}active{% endif %}">Home</a>
        <a href="/parser" class="{% if active_page == 'parser' %}active{% endif %}">Parser &amp; Evaluation</a>
        <a href="/gs_builder" class="{% if active_page == 'gs_builder' %}active{% endif %}">Gold Standard</a>
        <a href="/stats" class="{% if active_page == 'stats' %}active{% endif %}">Stats</a>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
